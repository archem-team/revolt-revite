        <!-- The marketplace shares the PepChat bundle, but its first paint must
            match the marketplace instead of flashing the chat theme. This runs
            before application CSS and JavaScript so even a cold load starts on
            the correct canvas. -->
        <script>
            if (window.location.hostname === "market.peptide.chat") {
                document.documentElement.setAttribute(
                    "data-marketplace-host",
                    "true",
                );
            }
        </script>
        <style>
            html[data-marketplace-host="true"],
            html[data-marketplace-host="true"] body {
                --market-boot-paper: oklch(94% 0.016 95);
                --market-boot-surface: oklch(97% 0.012 95);
                --market-boot-ink: oklch(20% 0.012 250);
                --market-boot-font-display: "Arial Rounded MT Bold",
                    "Trebuchet MS", system-ui, sans-serif;
                --market-boot-font-body: "Trebuchet MS", system-ui, sans-serif;
                background: var(--market-boot-paper) !important;
            }

            .marketplace-boot {
                box-sizing: border-box;
                width: 100%;
                height: 100%;
                min-height: 100dvh;
                overflow: hidden;
                background: var(--market-boot-paper);
                color: var(--market-boot-ink);
                font-family: var(--market-boot-font-body);
            }

            .marketplace-boot *,
            .marketplace-boot *::before,
            .marketplace-boot *::after {
                box-sizing: border-box;
            }

            .marketplace-boot__header {
                height: 74px;
                padding: 0 48px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid currentColor;
            }

            .marketplace-boot__brand {
                min-width: 124px;
                min-height: 38px;
                padding: 8px 16px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 12px;
                background: var(--market-boot-ink);
                color: var(--market-boot-surface);
                font-weight: 800;
                letter-spacing: 0.02em;
            }

            .marketplace-boot__main {
                width: min(100%, 1280px);
                margin: 0 auto;
                padding: 40px 48px;
            }

            .marketplace-boot__eyebrow {
                margin: 0 0 12px;
                font: 700 11px/1.3 ui-monospace, "SFMono-Regular", Consolas,
                    monospace;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .marketplace-boot h1 {
                max-width: 720px;
                margin: 0;
                font-family: var(--market-boot-font-display);
                font-size: clamp(38px, 4.6vw, 64px);
                line-height: 0.94;
                letter-spacing: -0.045em;
                overflow-wrap: anywhere;
            }

            .marketplace-boot__status {
                width: fit-content;
                margin: 48px 0 0;
                padding: 10px 14px;
                border: 1px solid currentColor;
                border-radius: 999px;
                background: var(--market-boot-surface);
                font-size: 14px;
                font-weight: 700;
            }

            @media (max-width: 640px) {
                .marketplace-boot__header {
                    height: 64px;
                    padding: 0 20px;
                }

                .marketplace-boot__main {
                    padding: 32px 20px;
                }

                .marketplace-boot__status {
                    margin-top: 36px;
                }
            }
        </style>

        <!--Stale-release and failed-boot recovery. A document restored from
            bfcache, an old PWA worker, or a mid-session deploy can reference
            assets that no longer exist. Mobile browsers can also surface a
            failed dynamic import only as an unhandled rejection. Recover once
            with a fresh document, then show a usable recovery screen instead
            of leaving the user on an empty canvas.-->
        <script>
            (function () {
                var KEY = "pepchat-boot-reload-at";
                var RELOAD_GUARD_MS = 30000;
                var dynamicImportFailure =
                    /chunkloaderror|loading chunk|dynamically imported module|importing a module script failed/i;

                function reloadOnce() {
                    var last = 0;
                    try {
                        last = +sessionStorage.getItem(KEY) || 0;
                    } catch (error) {}
                    if (Date.now() - last < RELOAD_GUARD_MS) return false;
                    try {
                        sessionStorage.setItem(KEY, String(Date.now()));
                    } catch (error) {}
                    location.reload();
                    return true;
                }

                function showRecovery() {
                    var app = document.getElementById("app");
                    var recovery = document.getElementById("boot-recovery");
                    if (app) app.setAttribute("hidden", "");
                    if (recovery) recovery.removeAttribute("hidden");
                }

                window.__pepchatRetryBoot = function () {
                    location.reload();
                };

                window.__pepchatRecoverBoot = function () {
                    if (!reloadOnce()) showRecovery();
                };

                window.__pepchatResetBoot = function () {
                    var clearCaches = window.caches
                        ? caches
                              .keys()
                              .then(function (keys) {
                                  return Promise.all(
                                      keys.map(function (key) {
                                          return caches.delete(key);
                                      }),
                                  );
                              })
                              .catch(function () {})
                        : Promise.resolve();
                    var clearWorkers = navigator.serviceWorker
                        ? navigator.serviceWorker
                              .getRegistrations()
                              .then(function (workers) {
                                  return Promise.all(
                                      workers.map(function (worker) {
                                          return worker.unregister();
                                      }),
                                  );
                              })
                              .catch(function () {})
                        : Promise.resolve();

                    Promise.all([clearCaches, clearWorkers]).then(function () {
                        location.reload();
                    });
                };

                window.addEventListener(
                    "error",
                    function (event) {
                        var el = event.target;
                        var isAssetElement =
                            el &&
                            (el.tagName === "SCRIPT" ||
                                el.tagName === "LINK") &&
                            (el.src || el.href || "").indexOf("/assets/") !==
                                -1;
                        if (isAssetElement && !reloadOnce()) showRecovery();
                    },
                    true,
                );

                window.addEventListener("unhandledrejection", function (event) {
                    var reason = event.reason;
                    var message = String(
                        (reason && (reason.message || reason.name)) ||
                            reason ||
                            "",
                    );
                    if (!dynamicImportFailure.test(message)) return;
                    window.__pepchatRecoverBoot();
                });

                window.addEventListener("load", function () {
                    setTimeout(function () {
                        var app = document.getElementById("app");
                        if (app && !app.firstElementChild && !reloadOnce()) {
                            showRecovery();
                        }
                    }, 4000);
                });
            })();
        </script>

        <!--CSS for noscript screen-->
        <style>
            noscript {
                background: #242424;
                color: white;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
            }
            noscript > div {
                padding: 12px;
                display: flex;
                font-family: "Open Sans", sans-serif;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }
            noscript > div > h1 {
                margin: 8px 0;
                text-transform: uppercase;
                font-size: 20px;
                font-weight: 700;
            }
            noscript > div > p {
                margin: 4px 0;
                font-size: 14px;
            }
            noscript > div > a {
                align-self: center;
                margin-top: 20px;
                padding: 8px 10px;
                font-size: 14px;
                width: 80px;
                font-weight: 600;
                background: #ed5151;
                border-radius: 4px;
                text-decoration: none;
                color: white;
                transition: background-color 0.2s;
            }
            noscript > div > a:hover {
                background-color: #cf4848;
            }
            noscript > div > a:active {
                background-color: #b64141;
            }
            #boot-recovery {
                box-sizing: border-box;
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                padding: 24px;
                background: #100518;
                color: #f6f1f8;
                font: 16px/1.5 "Open Sans", sans-serif;
                text-align: center;
            }
            #boot-recovery[hidden] {
                display: none;
            }
            #boot-recovery h1,
            #boot-recovery p {
                margin: 0;
            }
            #boot-recovery h1 {
                font-size: 22px;
            }
            #boot-recovery .actions {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin-top: 8px;
            }
            #boot-recovery button {
                min-height: 44px;
                padding: 0 18px;
                border: 0;
                border-radius: 999px;
                background: #c92a68;
                color: white;
                font: inherit;
                font-weight: 600;
            }
            #boot-recovery button.secondary {
                background: #352c3c;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <section id="boot-recovery" role="alert" hidden>
            <h1>PepChat couldn’t finish loading</h1>
            <p>Refresh the app, or clear its cached files if this continues.</p>
            <div class="actions">
                <button type="button" onclick="window.__pepchatRetryBoot()">
                    Refresh PepChat
                </button>
                <button
                    class="secondary"
                    type="button"
                    onclick="window.__pepchatResetBoot()"
                >
                    Clear cache and refresh
                </button>
            </div>
        </section>
        <script type="module" src="/src/main.tsx"></script>
        <noscript>
            <div>
                <h1>Well, this is really awkward...</h1>
                <p>Seems like your JavaScript is disabled.</p>
                <p>You'll need to enable JavaScript to run this app.</p>
                <a href="https://peptide.chat" target="_blank">Reload</a>
            </div>
        </noscript>
    </body>
