    #           with:
    #               path: /tmp/.buildx-cache/${{ matrix.architecture }}
    #               key: ${{ runner.os }}-buildx-${{ matrix.architecture }}-${{ github.sha }}
    #         - name: Build
    #           uses: docker/build-push-action@v2
    #           with:
    #               context: .
    #               platforms: ${{ matrix.architecture }}
    #         #       cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.architecture }}
    #         #       cache-to: type=local,dest=/tmp/.buildx-cache-new/${{ matrix.architecture }},mode=max
    #         # - name: Move cache
    #         #   run: |
    #         #       rm -rf /tmp/.buildx-cache/${{ matrix.architecture }}
    #         #       mv /tmp/.buildx-cache-new/${{ matrix.architecture }} /tmp/.buildx-cache/${{ matrix.architecture }}

    publish:
        # needs: [test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        if: github.event_name != 'pull_request'
        env:
            IMAGE_NAME: ghcr.io/archem-team/revolt-revite-${{ (github.ref_name == 'master' || github.ref_name == 'pre-production') && 'pre' || 'stage' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  submodules: "recursive"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            # Branch-aware deploy targets so this file is identical on every
            # branch: master/pre-production -> "-pre" image + prod config,
            # anything else (stage) -> "-stage" image + stage config. A
            # stage<->master merge of this file must never change where a
            # branch deploys.
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v3
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ github.sha }}
                      type=raw,value=assets-base
            # - name: Login to DockerHub
            #   uses: docker/login-action@v1
            #   with:
            #       username: ${{ secrets.DOCKERHUB_USERNAME }}
            #       password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Login to Github Container Registry
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Restore retained assets from previous release
              shell: bash
              run: |
                  mkdir -p previous-release/assets previous-release/asset-releases
                  if docker pull "$IMAGE_NAME:assets-base"; then
                      container_id=$(docker create "$IMAGE_NAME:assets-base")
                      trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
                      docker cp "$container_id:/usr/src/app/dist/assets/." previous-release/assets/ || true
                      docker cp "$container_id:/usr/src/app/dist/asset-releases/." previous-release/asset-releases/ || true
                  else
                      echo "No previous asset base found; publishing the first retained release."
                  fi
            - name: Build and publish
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      RELEASE_ID=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
    deploy:
        needs: [publish]
        runs-on: ubuntu-latest
        env:
            CONFIG_BRANCH: ${{ (github.ref_name == 'master' || github.ref_name == 'pre-production') && 'prod' || 'stage' }}
            IMAGE_NAME: ghcr.io/archem-team/revolt-revite-${{ (github.ref_name == 'master' || github.ref_name == 'pre-production') && 'pre' || 'stage' }}
            CLONE_DIR: $GITHUB_WORKSPACE/config
            CONFIG_FILE: $GITHUB_WORKSPACE/config/apps/pepchat/kustomization.yaml
        # ref_type guard: only branch pushes may re-pin an environment
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        steps:
            - name: Set up deploy key
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "${{ secrets.ARCHEM_CONFIG_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            - name: Checkout Configuration Repository
              run: |
                  echo "Cloning configuration repository"
                  git clone -b $CONFIG_BRANCH git@github.com:archem-team/administration-cluster.git $CLONE_DIR

            - name: Set Up Git Identity
              run: |
                  cd $CLONE_DIR
                  git config user.email "ci@example.com"
                  git config user.name "CI Bot"

            - name: Update Image Tag in kustomization.yaml
              run: |
                  awk -v value="  newTag: ${{ github.sha }}" '{sub(/^  newTag: .*/, value); print}' $CONFIG_FILE > temp.yml && mv temp.yml $CONFIG_FILE

                  awk -v value="  newName: $IMAGE_NAME" '{sub(/^  newName: .*/, value); print}' $CONFIG_FILE > temp.yml && mv temp.yml $CONFIG_FILE

            - name: Commit & Push Changes
              run: |
                  cd $CLONE_DIR
                  git add .
                  git commit -am "Update image tag to ${{ github.sha }}" || echo "no changes"

                  git push origin $CONFIG_BRANCH
