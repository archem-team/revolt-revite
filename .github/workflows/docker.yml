name: Docker

# A later release must not overtake an earlier retained-asset publication.
concurrency:
    group: pepchat-web-${{ (github.ref_name == 'master' || github.ref_name == 'pre-production') && 'production' || 'stage' }}
    cancel-in-progress: false

on:
    push:
        branches:
            - "master"
            - "pre-production"
            - "stage"
        tags:
            - "*"
        paths-ignore:
            - ".github/**"
            - "!.github/workflows/docker.yml"
            - "!.github/workflows/preview_*.yml"
            - ".vscode/**"
            - ".gitignore"
            - ".gitlab-ci.yml"
            - "LICENSE"
            - "README"
    pull_request:
        branches:
            - "stage"
        paths-ignore:
            - ".github/**"
            - "!.github/workflows/docker.yml"
            - "!.github/workflows/preview_*.yml"
            - ".vscode/**"
            - ".gitignore"
            - ".gitlab-ci.yml"
            - "LICENSE"
            - "README"
    workflow_dispatch:

jobs:
    # test:
    #     runs-on: ubuntu-latest
    #     strategy:
    #         matrix:
